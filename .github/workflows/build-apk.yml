name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm ci

      - name: Simulação do jogo (bots nos 3 modos)
        run: |
          npx playwright install --with-deps chromium
          npm run build
          npm test

      - name: Sincronizar com o Android
        run: npx cap sync android

      - name: Compilar APK de teste (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Nomear o APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/ian-e-seus-amigos.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ian-e-seus-amigos-apk
          path: out/ian-e-seus-amigos.apk

      - name: Publicar na página de Releases (link fixo "latest")
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/ian-e-seus-amigos.apk \
            --title "Ian e Seus Amigos - versão de teste #${{ github.run_number }}" \
            --notes "APK de teste (assinatura de depuração). Commit ${{ github.sha }}. Instale no Android permitindo 'apps desconhecidos'." \
            --latest
